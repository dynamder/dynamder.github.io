# ─────────────────────────────────────────────────────────────
#  站点基础配置  hugo.toml
#  改完执行 `hugo server -D` 看效果，`hugo` 产出 public/
# ─────────────────────────────────────────────────────────────

# TODO: 换成你自己的地址。用户站必须是 https://<用户名>.github.io/
baseURL = "https://dynamder.github.io/"
title = "Dynamder's Blog"

locale = "zh-CN" # v0.158+ 用 locale 取代了 languageCode
defaultContentLanguage = "zh"
# 中文留在根路径（/posts/...），英文在 /en/ 下。
# 改成 true 会让中文搬到 /zh/，现有 Giscus 讨论楼（按 pathname 映射）全部失联
defaultContentLanguageInSubdir = false
hasCJKLanguage = true # 中文按字计词，摘要/字数统计才准

enableRobotsTXT = true
enableEmoji = true
enableInlineShortcodes = true
pygmentsUseClasses = true
buildDrafts = false
buildFuture = false
buildExpired = false

copyright = "© {YEAR} Dynamder"

# 主题通过 Hugo Modules 管理（见下面 [module]），不用 themes/ 目录
[module]
# 国内访问 github.com 常不通，主题走 Go 模块代理下载
proxy = "https://goproxy.cn,direct"

[[module.imports]]
path = "github.com/adityatelange/hugo-PaperMod"

# 首页除了 HTML/RSS 还要出 index.json，客户端搜索 (Fuse.js) 靠它
[outputs]
home = ["HTML", "RSS", "JSON"]

[pagination]
pagerSize = 10

[minify]
disableXML = true

[taxonomies]
tag = "tags"
category = "categories"

# ─── 顶部导航 ────────────────────────────────────────────────
[[menu.main]]
name = "文章"
url = "/posts/"
weight = 10

[[menu.main]]
name = "归档"
url = "/archives/"
weight = 20

[[menu.main]]
name = "标签"
url = "/tags/"
weight = 30

[[menu.main]]
name = "搜索"
url = "/search/"
weight = 40

[[menu.main]]
name = "关于"
url = "/about/"
weight = 50

# ─── 主题参数 ────────────────────────────────────────────────
[params]
env = "production" # 开启 OG / Twitter Card / Schema.org
description = "记录一些后端、Go、基础设施与踩坑"
author = "Dynamder"
defaultTheme = "auto" # 跟随系统，可手动切换
mainSections = ["posts"]
DateFormat = "2006-01-02"

ShowReadingTime = true
ShowWordCount = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowToc = true # 文章目录
TocOpen = false
ShowRssButtonInSectionTermList = true
ShowAllPagesInArchive = true
ShowPageNums = true
disableScrollToTop = false
# 语言切换器显示「简体中文 / English」而不是「Zh / En」
displayFullLangName = true

# 评论区总开关：单篇文章可用 front matter 的 comments = false 单独关掉
comments = true

[params.homeInfoParams]
Title = "你好，我是 Dynamder 👋"
Content = """
这里放后端、Go、基础设施和自己踩过的坑。

- 文章都在 [文章](/posts/) 里，标签见 [标签](/tags/)
- 想找什么直接点 [搜索](/search/)
- 关于我：[关于](/about/)
"""

[[params.socialIcons]]
name = "github"
url = "https://github.com/dynamder"

[[params.socialIcons]]
name = "Rss"
url = "/index.xml"

# 每篇文章底部的「编辑此页」链接
[params.editPost]
URL = "https://github.com/dynamder/dynamder.github.io/edit/main/content"
Text = "编辑此页"
appendFilePath = true

# 站内搜索的 Fuse.js 参数
[params.fuseOpts]
isCaseSensitive = false
shouldSort = true
location = 0
distance = 1000
threshold = 0.4
minMatchCharLength = 0
keys = ["title", "permalink", "summary", "content"]

# 评论区：Giscus（基于 GitHub Discussions，零后端零成本）
# repoId / categoryId 由 API 取得，换仓库时要一起换
# 还需在仓库上安装 giscus App：https://github.com/apps/giscus/installations/new
[params.giscus]
repo = "dynamder/dynamder.github.io"
repoId = "R_kgDOVnY9Kg"
category = "Announcements"
categoryId = "DIC_kwDOVnY9Ks4DKrd3"
mapping = "pathname" # 按路径映射讨论楼，换标题也不会断
strict = "0"
reactionsEnabled = "1"
emitMetadata = "0"
inputPosition = "top"
lang = "zh-CN"

# ─── Markdown 渲染 ───────────────────────────────────────────
[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true # 允许正文里直接写 HTML（比如 <div align="center">）

[markup.highlight]
noClasses = false # 跟随明暗主题切换代码高亮
guessSyntax = true
lineNos = false

# ─── 多语言 ──────────────────────────────────────────────────
# 内容按文件名后缀配对：xxx.md（中文）/ xxx.en.md（英文）
[languages.zh]
label = "简体中文"
weight = 1

[languages.en]
label = "English"
weight = 2
title = "Dynamder's Blog"
locale = "en-US"

# 面向读者的 params 必须在语言级重写，根 [params] 的值不会自动翻译
[languages.en.params]
description = "Notes on backend, Go, and infrastructure"

# 只覆盖这一个字段，其余（repo / repoId / categoryId …）从根 [params.giscus] 继承
[languages.en.params.giscus]
lang = "en"

[languages.en.params.homeInfoParams]
Title = "Hi, I'm Dynamder 👋"
Content = """
Notes on backend, Go, infrastructure, and the potholes along the way.

- Posts live under [Posts](/posts/)
- Looking for something specific? Try [Search](/search/)
- More about me: [About](/about/)
"""

# 菜单也要按语言各写一份，根 [menu.main] 只服务中文
[[languages.en.menu.main]]
name = "Posts"
url = "/posts/"
weight = 10

[[languages.en.menu.main]]
name = "Archive"
url = "/archives/"
weight = 20

[[languages.en.menu.main]]
name = "Tags"
url = "/tags/"
weight = 30

[[languages.en.menu.main]]
name = "Search"
url = "/search/"
weight = 40

[[languages.en.menu.main]]
name = "About"
url = "/about/"
weight = 50
